<div class="permisos-layout fade-in">

  <div class="header-section">
    <div>
      <h2 class="page-title">Trámites y Permisos</h2>
      <p class="page-subtitle">Gestiona tus solicitudes de descanso, vacaciones y licencias.</p>
    </div>

    <div class="tabs-container">
      <button class="tab-btn" [class.active]="tabActiva === 'solicitar'" (click)="cambiarTab('solicitar')">
        Nueva Solicitud
      </button>
      <button class="tab-btn" [class.active]="tabActiva === 'historial'" (click)="cambiarTab('historial')">
        Mis Trámites
      </button>
    </div>
  </div>

  @if (tabActiva === 'solicitar') {
    <div class="split-view">

      <app-permiso-form
        [firmaGuardadaUrl]="firmaGuardadaUrl"
        (previewDataChange)="onPreviewData($event)"
        (onEnviar)="generarPdf()">
      </app-permiso-form>

      <div class="preview-wrapper">
        <app-permiso-pdf-preview
          [previewData]="previewData"
          [empleadoInfo]="empleadoInfo">
        </app-permiso-pdf-preview>

        @if (generandoPdf) {
          <div class="pdf-loading-overlay">
            <div class="pdf-loading-spinner"></div>
            <span>Enviando solicitud...</span>
          </div>
        }
      </div>

    </div>
  }

  @if (tabActiva === 'historial') {
    @if (cargandoHistorial) {
      <div class="historial-loading">
        <div class="pdf-loading-spinner"></div>
        <span>Cargando tus trámites...</span>
      </div>
    } @else {
      <app-permiso-historial [tramites]="misTramites"></app-permiso-historial>
    }
  }

</div>
