<div class="banner-wrapper fade-in">

    <div class="avatar-wrapper">
        <div class="status-ring"></div>
        <div class="avatar-main">
            <img *ngIf="perfil?.fotoUrl" [src]="perfil.fotoUrl" alt="Foto de perfil">
            <div *ngIf="!perfil?.fotoUrl" class="placeholder">{{ perfil?.iniciales }}</div>
        </div>
    </div>

    <div class="banner-details">

        <div class="identity-box">
            <h1 class="name">{{ perfil?.nombreCompleto }}</h1>
            <p class="role">{{ perfil?.rol }}</p>
            <div class="status-chip">
                <span class="dot"></span> Activo
            </div>
        </div>

        <div class="badges-container">
            <div class="badge-item">
                <i class="fa fa-map-marker"></i> {{ perfil?.ubicacion }}
            </div>
            <div class="badge-item">
                <i class="fa fa-calendar"></i> Ingresó {{ perfil?.fechaIngreso }}
            </div>
        </div>

    </div>
</div>
