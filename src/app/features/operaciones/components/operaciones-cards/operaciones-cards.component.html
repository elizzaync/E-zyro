<div class="cards-grid">
    @for (card of metricas; track card.id) {
    <div class="metric-card" [class.is-highlighted]="card.resaltado">

        <div class="icon-circle" [style.color]="card.colorIcono" [style.backgroundColor]="card.colorIcono + '1A'">
            <div class="svg-container">
                @switch (card.id) {
                @case ('pendientes') {
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                }
                @case ('activos') {
                <svg viewBox="0 0 24 24">
                    <path
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                    </path>
                </svg>
                }
                @case ('hechos') {
                <svg viewBox="0 0 24 24">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                }
                @case ('hoy') {
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                }
                }
            </div>
        </div>

        <div class="metric-value" [style.color]="card.resaltado ? card.colorIcono : ''">
            {{ card.valor }}
        </div>
        <div class="metric-label">{{ card.titulo }}</div>

    </div>
    }
</div>
