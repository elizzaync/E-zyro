<div class="grupo-card">

  <!-- CABECERA DEL GRUPO -->
  <div class="grupo-header">

    <div class="grupo-info">
      <div class="grupo-icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div class="grupo-meta">
        <h3 class="grupo-nombre">{{ grupo.nombre }}</h3>
        <span class="grupo-count">
          {{ grupo.equipos.length }} equipo{{ grupo.equipos.length !== 1 ? 's' : '' }}
        </span>
      </div>
    </div>

    <!-- BOTONES DE ACCIÓN -->
    <div class="grupo-acciones">
      <button
        class="btn-accion"
        [class.bloqueado]="bloqueado"
        [disabled]="bloqueado"
        [title]="bloqueado ? 'Disponible al completar el 100%' : 'Generar informe general'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Informe</span>
        @if (bloqueado) {
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        }
      </button>

      <button
        class="btn-accion btn-certificado"
        [class.bloqueado]="bloqueado"
        [disabled]="bloqueado"
        [title]="bloqueado ? 'Disponible al completar el 100%' : 'Generar certificado'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="6"/>
          <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
        <span>Certificado</span>
        @if (bloqueado) {
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        }
      </button>
    </div>
  </div>

  <!-- BARRA DE PROGRESO -->
  <div class="progreso-section">
    <div class="progreso-barra-bg">
      <div
        class="progreso-barra-fill"
        [style.width.%]="progreso"
        [style.background]="progresoColor">
      </div>
    </div>
    <span class="progreso-label" [style.color]="progresoColor">
      {{ progreso }}% completado
    </span>
  </div>

  <!-- LISTA DE EQUIPOS -->
  <div class="grupo-equipos">
    @for (equipo of grupo.equipos; track equipo.id; let i = $index) {
    <app-equipo-tarjeta
      [equipo]="equipo"
      [style.animation-delay]="(i * 80) + 'ms'">
    </app-equipo-tarjeta>
    }
  </div>

</div>
