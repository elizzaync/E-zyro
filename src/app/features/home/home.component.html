<app-navbar></app-navbar>

<main class="home-layout">
  <div class="home-content fade-in">

    <header class="home-header">
      <h2 class="welcome-title">
        {{ saludoTiempo }}, <span class="gradient-text">{{ nombreUsuario }}</span> <span class="wave-emoji">👋</span>
      </h2>
      <p class="welcome-subtitle">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        {{ fechaActual }}
      </p>
    </header>

    <div class="dashboard-grid">

      <div class="left-panel">
        <div class="summary-grid">
          @for (tarjeta of tarjetasHome; track tarjeta.titulo) {
          <app-summary-card [titulo]="tarjeta.titulo" [valor]="tarjeta.valor" [icono]="tarjeta.icono"
            [tema]="tarjeta.tema" [subtitulo]="tarjeta.subtitulo">
          </app-summary-card>
          }
        </div>
      </div>

      <div class="right-panel">
        <app-calendar-widget></app-calendar-widget>
      </div>

    </div>

  </div>
</main>
