<div class="calendar-card">
    <div class="calendar-header">
        <button class="nav-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <h3 class="month-title">{{ mesActual }}</h3>
        <button class="nav-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <div class="weekdays-grid">
        @for (dia of diasSemana; track dia) {
        <div class="weekday">{{ dia }}</div>
        }
    </div>

    <div class="days-grid">
        @for (dia of diasMes; track $index) {
        <div class="day-cell" [class.is-today]="dia.isHoy" [class.empty]="!dia.num">
            @if (dia.num) {
            <span class="day-number">{{ dia.num }}</span>
            @if (dia.hasEvent && !dia.isHoy) {
            <span class="event-dot"></span>
            }
            }
        </div>
        }
    </div>

    <div class="calendar-footer">
        <a href="javascript:void(0)" class="link-calendar">Ver calendario completo
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
        </a>
    </div>
</div>
