@if (mostrarNavbar) {
<app-navbar></app-navbar>
}

<main [class.portal-mode]="esPortalCliente">
    <!-- El fondo de partículas global lo dibuja public/background.js
         (canvas fixed con z-index:-1, detrás de navbar, cards y modales) -->
    <router-outlet></router-outlet>
</main>

<app-toast></app-toast>

@if (mostrarNavbar && !esPortalCliente) {
<app-chatbot></app-chatbot>
}

@if (showLogoutModal) {
<div class="modal-backdrop-pro" (click)="cancelarSalir()"></div>
<div class="modal-dialog-pro fade-in-up">
    <div class="modal-body-pro">
        <div class="logout-icon-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h3>Cerrar Sesión</h3>
        <p>¿Estás seguro de que deseas cerrar tu sesión en el sistema?</p>
    </div>
    <div class="modal-footer-pro">
        <button class="btn-cancel-pro" (click)="cancelarSalir()">Cancelar</button>
        <button class="btn-save-main" (click)="confirmarSalir()" style="background-color: #ef4444;">Sí, salir</button>
    </div>
</div>
}
